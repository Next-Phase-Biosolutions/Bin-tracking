name: Deploy Production

# Applies Prisma migrations to Supabase production.
# Run automatically on merge to main, or manually via workflow_dispatch.
#
# Required GitHub environment: production
# Required environment secrets:
#   DIRECT_URL            — Supabase direct connection (port 5432) — used for migrations
#   DATABASE_URL          — Supabase pooler (port 6543) — optional here until seed is re-enabled
#
# NOTE: Bootstrap seed is disabled until packages/db/prisma/seed.ts with
# SEED_ONLY_IF_EMPTY guard is pushed to main. Run seed manually once if needed.

on:
    workflow_dispatch:
    push:
        branches: [main]

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    migrate:
        name: Migrate production database
        runs-on: ubuntu-latest
        environment: production
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Validate required secrets
              env:
                  DIRECT_URL: ${{ secrets.DIRECT_URL }}
              run: |
                  if [ -z "$DIRECT_URL" ]; then
                    echo "::error title=Missing secret::DIRECT_URL is not set in the production environment"
                    exit 1
                  fi

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm --filter @bin-tracker/db generate

            # Migrations must use the DIRECT connection (not the pooler).
            - name: Apply migrations to Supabase
              run: pnpm --filter @bin-tracker/db migrate:deploy
              env:
                  DATABASE_URL: ${{ secrets.DIRECT_URL }}
                  DIRECT_URL: ${{ secrets.DIRECT_URL }}

            - name: Migration status
              run: pnpm --filter @bin-tracker/db migrate:status
              env:
                  DATABASE_URL: ${{ secrets.DIRECT_URL }}
                  DIRECT_URL: ${{ secrets.DIRECT_URL }}
