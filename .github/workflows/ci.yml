name: CI

on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

    migrate-and-test:
        runs-on: ubuntu-latest
        needs: lint

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: bin_tracker_ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bin_tracker_ci?schema=public
            DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bin_tracker_ci?schema=public
            DISABLE_AUTH: 'true'
            SEED_ONLY_IF_EMPTY: 'false'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.4

            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm db:generate

            - name: Apply migrations (migrate deploy)
              run: pnpm db:migrate

            - name: Seed test data
              run: pnpm db:seed:local

            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test
