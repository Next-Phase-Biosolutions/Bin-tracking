name: CI

on:
    pull_request:
        branches: [dev, main]
    push:
        branches: [dev, main]

jobs:
    check:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Pure grep against source — no dependencies or DB needed, so it
            # runs first and fails fast.
            - name: Tenancy audit
              run: bash apps/api/scripts/tenancy-audit.sh

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            # @bin-tracker/types imports Prisma types — client must exist before turbo build
            - name: Generate Prisma Client
              run: pnpm --filter @bin-tracker/db generate

            # Uses typecheck instead of lint until eslint deps are on main
            # (apps/api/package.json + pnpm-lock.yaml with eslint must be pushed first)
            - name: Typecheck
              run: pnpm typecheck

    migrate-and-test:
        runs-on: ubuntu-latest
        needs: check

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: bin_tracker_ci
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bin_tracker_ci?schema=public
            DIRECT_URL: postgresql://postgres:postgres@localhost:5432/bin_tracker_ci?schema=public
            DISABLE_AUTH: 'true'
            SEED_ONLY_IF_EMPTY: 'false'

        steps:
            - uses: actions/checkout@v4

            - uses: pnpm/action-setup@v4
              with:
                  version: 9.15.4

            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate Prisma Client
              run: pnpm --filter @bin-tracker/db generate

            - name: Apply migrations (migrate deploy)
              run: pnpm --filter @bin-tracker/db migrate:deploy

            - name: Seed test data
              run: pnpm --filter @bin-tracker/db seed:ci

            - name: Test
              run: pnpm test
