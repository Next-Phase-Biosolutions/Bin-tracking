name: Deploy to VPS

# Zero-downtime blue-green deploy of the bin-tracker API to the Hostinger VPS.
# See kvmplan.md for the full runbook (§7-10). Triggered via workflow_run
# ONLY after deploy-production.yml (the migration workflow) completes
# successfully — never directly on push — so the DB schema is always ahead of
# or equal to the code being deployed. A plain `push` trigger here would race
# the migration job and could serve new code against an un-migrated schema.
#
# Required GitHub environment: production (same gated-approval Environment as deploy-production.yml)
# Required secrets:
#   VPS_HOST             — VPS public IPv4 (SSH over the internet, key-only; the
#                          host key is pinned below via `fingerprint`)
#   VPS_DEPLOY_SSH_KEY   — dedicated deploy-only key pair (not a personal key).
#                          Its public half in faizan's authorized_keys on the box is
#                          locked with `command="…deploy…",restrict`, so this key can
#                          ONLY run the deploy — no shell, no port forwarding. The
#                          `script` below is therefore informational: the forced
#                          command on the server is what actually runs.
#
# If the VPS is rebuilt its host key changes: update `fingerprint` below
# (`ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub` on the box).

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Production']
    types: [completed]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Blue-green deploy to VPS
    # workflow_run fires on failure too — only deploy when the migration
    # workflow succeeded on main. workflow_dispatch stays as a manual escape hatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f # v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: faizan
          key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          fingerprint: SHA256:gV7bI5kx9lOrs3pBYWTxMi5TaM0K/o2Saz99YF28iME
          script: |
            cd /opt/bin-tracker
            git pull --ff-only origin main
            cd infra/vps/bintracker-api
            bash deploy.sh
