[build]
  # Single site, single domain: apps/marketing owns "/" (the public site,
  # login/signup), apps/web owns "/app/*" (the authenticated tool). Build
  # both, then assemble one combined publish directory — marketing's build
  # at the root, web's build nested under app/.
  command = "pnpm db:generate && pnpm --filter=@bin-tracker/marketing build && pnpm --filter=@bin-tracker/web build && rm -rf dist && mkdir -p dist/app && cp -r apps/marketing/dist/. dist/ && cp -r apps/web/dist/. dist/app/"

  publish = "dist"

  base = "/"

[[redirects]]
  # NFC phone pages (/app/tap, /app/register) call the RELATIVE path /trpc so the httpOnly
  # device cookie is first-party: set on, and sent back to, this same origin. A rewrite
  # (status 200), not a redirect, so the browser never leaves the site. MUST stay above the
  # catch-alls below, which would otherwise answer /trpc/* with an HTML page.
  # The authenticated app does NOT use this: it talks to the API directly via VITE_API_URL.
  from = "/trpc/*"
  to = "https://api.nextphasebiosolutions.com/trpc/:splat"
  status = 200
  force = true

[[redirects]]
  # apps/web's client-side routes — must come before the marketing catch-all
  # below, since Netlify matches redirects top-to-bottom, first match wins.
  from = "/app/*"
  to = "/app/index.html"
  status = 200

[[redirects]]
  # apps/marketing's client-side routes.
  from = "/*"
  to = "/index.html"
  status = 200
